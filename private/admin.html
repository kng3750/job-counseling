<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계정 관리 · 직업상담</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/auth.css"><script src="/assets/admin.js" defer></script></head><body><main class="container auth-container"><header><p class="eyebrow">CAREER COUNSELING</p><h1>계정 관리</h1><p class="subtitle">직업상담 질문지 생성기</p></header><nav class="toolbar"><a href="/app">상담 화면</a><a href="/password">비밀번호 변경</a><button id="logout" type="button">로그아웃</button></nav><section class="input-section"><h2>가입 신청 및 이용 승인</h2><p>신청자를 확인한 뒤 승인해 주세요. 정지하면 기존 로그인도 해제됩니다.</p><button id="refresh" type="button">새로고침</button><div id="users" class="user-list"></div><div class="toolbar"><button id="prev" type="button">이전</button><button id="next" type="button">다음</button></div></section><section id="resetResult" class="input-section" hidden><h2>일회용 재설정 링크</h2><p>본인 확인 후 안전한 방법으로 전달해 주세요. 30분 후 만료됩니다.</p><textarea id="resetLink" readonly aria-label="재설정 링크"></textarea><button id="hideReset" type="button">링크 닫기</button></section><p id="message" role="status" aria-live="polite"></p></main></body></html>

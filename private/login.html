<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · 직업상담</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body><main class="container auth-container"><header><p class="eyebrow">CAREER COUNSELING</p><h1>로그인</h1><p class="subtitle">Job Counseling · Job Star 통합 계정</p></header><section class="input-section"><p>한 번 승인받은 계정으로 Job Counseling과 Job Star를 이용합니다.</p><form data-action="login"><div class="form-group"><label for="login">아이디</label><input id="login" name="login" type="text" required autocomplete="username" maxlength="40"></div><div class="form-group"><label for="password">비밀번호</label><input id="password" name="password" type="password" required autocomplete="current-password" maxlength="128"></div><button type="submit">로그인</button></form><p class="form-links"><a href="/register">가입 신청</a></p><p class="hint">비밀번호를 잊으셨다면 관리자에게 재설정을 요청해 주세요.</p></section><p id="message" role="status" aria-live="polite"></p></main></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀번호 변경 · 직업상담</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body><main class="container auth-container"><header><p class="eyebrow">CAREER COUNSELING</p><h1>비밀번호 변경</h1><p class="subtitle">직업상담 질문지 생성기</p></header><section class="input-section"><form data-action="password"><div class="form-group"><label for="currentPassword">현재 비밀번호</label><input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password" maxlength="128"></div><div class="form-group"><label for="password">비밀번호</label><input id="password" name="password" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></div><div class="form-group"><label for="confirmPassword">비밀번호 확인</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></div><button type="submit">비밀번호 변경</button></form><p><a href="/app">상담 화면으로 돌아가기</a></p></section><p id="message" role="status" aria-live="polite"></p></main></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가입 신청 · 직업상담</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body><main class="container auth-container"><header><p class="eyebrow">CAREER COUNSELING</p><h1>가입 신청</h1><p class="subtitle">Job Counseling · Job Star · ATS · Holland 통합 계정</p></header><section class="input-section"><p>중앙 관리자 승인 후 Job Counseling, Job Star, ATS, Holland를 모두 이용할 수 있습니다.</p><form data-action="register"><div class="form-group"><label for="name">이름</label><input id="name" name="name" type="text" required maxlength="80" autocomplete="name"></div><div class="form-group"><label for="login">아이디</label><input id="login" name="login" type="text" required pattern="[A-Za-z0-9._\-]{4,40}" minlength="4" maxlength="40" autocomplete="username"></div><p class="hint">아이디: 영문·숫자·점·밑줄·하이픈 4~40자<br>비밀번호: 15~128자</p><div class="form-group"><label for="password">비밀번호</label><input id="password" name="password" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></div><div class="form-group"><label for="confirmPassword">비밀번호 확인</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></div><button type="submit">가입 신청하기</button></form><p class="form-links"><a href="/login">로그인으로 돌아가기</a></p></section><p id="message" role="status" aria-live="polite"></p></main></body></html>
